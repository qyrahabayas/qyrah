<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:14px;min-width:0;font-family:'Jost',sans-serif;color:#0D0D0D" onMouseEnter="{{ enter }}" onMouseLeave="{{ leave }}">
  <div style="position:relative;width:100%;aspect-ratio:{{ ratio }};overflow:hidden;background:radial-gradient(120% 80% at 50% 28%, #EDECEA 0%, #DCDBD8 58%, #CBCAC7 100%);border-radius:18px">
    <div style="position:absolute;inset:0;transition:transform 900ms cubic-bezier(.2,.7,.2,1);transform:{{ scale }}">
      <image-slot radius="18" id="p-{{ product.id }}-1" src="{{ product.i1.src }}" credit="{{ product.i1.credit }}" credit-href="{{ product.i1.href }}" shape="rect" placeholder="{{ product.name }} · full length"></image-slot>
    </div>
    <sc-if value="{{ loadAlt }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;inset:0;transition:opacity 450ms ease;opacity:{{ alt }}">
      <image-slot radius="18" id="p-{{ product.id }}-2" src="{{ product.i2.src }}" credit="{{ product.i2.credit }}" credit-href="{{ product.i2.href }}" shape="rect" placeholder="{{ product.name }} · back view"></image-slot>
    </div></sc-if>
    <div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;border-radius:18px;mix-blend-mode:multiply;background:radial-gradient(120% 85% at 50% 30%, rgba(226,225,223,0.8) 0%, rgba(204,203,200,0.85) 60%, rgba(176,175,172,0.9) 100%)"></div><div aria-hidden="true" style="position:absolute;left:0;right:0;bottom:0;height:22%;pointer-events:none;border-radius:0 0 18px 18px;background:linear-gradient(to top, rgba(200,199,196,0.55), rgba(200,199,196,0))"></div>
    <button onClick="{{ product.open }}" aria-label="View {{ product.name }}" style="position:absolute;inset:0;background:transparent;border:0;padding:0;cursor:pointer;border-radius:12px" style-focus="outline:2px solid #C9A84C;outline-offset:-4px"></button>
    <button onClick="{{ product.wish }}" aria-label="{{ wishLabel }}" aria-pressed="{{ product.wished }}" style="position:absolute;top:10px;right:10px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:rgba(255,250,240,0.9);border:0;cursor:pointer;color:#861A22;transition:background 250ms;border-radius:999px" style-hover="background:#FFFAF0" style-focus="outline:2px solid #C9A84C;outline-offset:2px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="{{ heartFill }}" stroke="currentColor" stroke-width="1.3"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>
    </button>
  </div>
  <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start">
    <div style="display:flex;flex-direction:column;gap:3px;min-width:0">
      <button onClick="{{ product.open }}" style="font-family:'Cormorant',serif;font-size:23px;font-weight:500;line-height:1.1;text-align:left;background:none;border:0;padding:0;cursor:pointer;color:#0D0D0D" style-hover="color:#861A22">{{ product.name }}</button>
      <span style="font-size:12px;letter-spacing:0.08em;color:#5C5550">{{ product.cls }}</span>
    </div>
    <div style="display:flex;gap:5px;padding-top:9px;flex-shrink:0" aria-label="Available colours">
      <sc-for list="{{ product.dots }}" as="d" hint-placeholder-count="2">
        <span title="{{ d.name }}" style="width:9px;height:9px;border-radius:50%;background:{{ d.hex }};box-shadow:inset 0 0 0 1px rgba(13,13,13,0.28)"></span>
      </sc-for>
    </div>
  </div>
  <sc-if value="{{ product.priceText }}" hint-placeholder-val="{{ false }}">
    <span style="font-size:13px;letter-spacing:0.04em;margin-top:-6px">{{ product.priceText }}</span>
  </sc-if>
  <sc-if value="{{ product.actionLabel }}" hint-placeholder-val="{{ false }}">
    <button onClick="{{ product.action }}" style="height:44px;background:transparent;border:1px solid #861A22;color:#861A22;font-family:'Jost',sans-serif;font-size:12px;letter-spacing:0.14em;text-transform:uppercase;cursor:pointer;border-radius:12px;transition:background 250ms,color 250ms" style-hover="background:#861A22;color:#FFFAF0" style-focus="outline:2px solid #C9A84C;outline-offset:2px">{{ product.actionLabel }}</button>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:560},&quot;product&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;ratio&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;3 / 4&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { hover: false, seen: false };
  renderVals() {
    const p = this.props.product || {};
    return {
      product: p,
      ratio: this.props.ratio || p.ratio || '3 / 4',
      loadAlt: this.state.seen,
      enter: () => { if (window.matchMedia && !window.matchMedia('(hover: hover)').matches) return; this.setState({ hover: true, seen: true }); },
      leave: () => this.setState({ hover: false }),
      scale: this.state.hover ? 'scale(1.03)' : 'scale(1)',
      alt: this.state.hover ? 1 : 0,
      heartFill: p.wished ? '#861A22' : 'none',
      wishLabel: p.wished ? 'Remove from saved pieces' : 'Save piece'
    };
  }
}
</script>
</body>
</html>
